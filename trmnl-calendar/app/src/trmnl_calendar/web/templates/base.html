<!doctype html>
<html lang="en"{% if theme in ("light", "dark") %} data-theme="{{ theme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Calendar{% endblock %}</title>
<meta name="color-scheme" content="{{ 'light' if theme == 'light' else 'dark' if theme == 'dark' else 'light dark' }}">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
<nav class="nav" aria-label="Main">
  {% set on_month = request_path is defined and request_path.startswith('/month') %}
  <a href="/" {{ 'aria-current=page' if nav == 'home' and not on_month }}><svg class="ico" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Calendar</span></a>
  <a href="/month" {{ 'aria-current=page' if on_month }}><svg class="ico" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Month</span></a>
  <a href="/screen" {{ 'aria-current=page' if nav == 'screen' }}><svg class="ico" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/></svg><span>Screen</span></a>
  <a class="only-wide" href="/views" {{ 'aria-current=page' if nav == 'views' }}><span>Views</span></a>
  <a class="only-wide" href="/categories" {{ 'aria-current=page' if nav == 'categories' }}><span>Categories</span></a>
  <a class="only-wide" href="/people" {{ 'aria-current=page' if nav == 'people' }}><span>People</span></a>
  <a class="only-wide" href="/settings" {{ 'aria-current=page' if nav == 'settings' }}><span>Settings</span></a>
  <a class="only-narrow" href="/more" {{ 'aria-current=page' if nav in ('more', 'views', 'categories', 'people', 'settings') }}><svg class="ico" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span>More</span></a>
  {% if me %}<a class="me only-wide" href="/who?next={{ request_path | urlencode }}" title="Change who you are">{{ me.name }}</a>{% endif %}
</nav>
<main class="{% block main_class %}{% endblock %}">
{% block body %}{% endblock %}
</main>
<script src="/static/app.js?v={{ asset_v }}" defer></script>
</body>
</html>
