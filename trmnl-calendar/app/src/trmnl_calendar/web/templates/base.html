<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Calendar{% endblock %}</title>
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="nav" aria-label="Main">
  <a href="/" {{ 'aria-current=page' if nav == 'home' }}>Calendar</a>
  <a href="/views" {{ 'aria-current=page' if nav == 'views' }}>Views</a>
  <a href="/categories" {{ 'aria-current=page' if nav == 'categories' }}>Categories</a>
  <a href="/people" {{ 'aria-current=page' if nav == 'people' }}>People</a>
  <a href="/settings" {{ 'aria-current=page' if nav == 'settings' }}>Settings</a>
  {% if me %}<a class="me" href="/who?next={{ request_path | urlencode }}" title="Change who you are">{{ me.name }}</a>{% endif %}
</nav>
<main>
{% block body %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
