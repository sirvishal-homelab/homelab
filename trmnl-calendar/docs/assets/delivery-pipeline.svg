<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 805" width="1060" height="805" font-family="DejaVu Sans, Arial, sans-serif">
<title>TRMNL calendar delivery pipeline</title>
<desc>Claude Code edits a branch, GitHub Actions tests and builds an image on merge, the home server pulls it, checks health and rolls back on failure.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1060" height="805" fill="#ffffff"/>
<text x="530" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">TRMNL calendar: delivery pipeline</text>
<rect x="15" y="55" width="300" height="715" rx="12" fill="#f4f4f4" stroke="#aaa"/>
<text x="165" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">Your workstation</text>
<rect x="365" y="55" width="300" height="715" rx="12" fill="#f4f4f4" stroke="#aaa"/>
<text x="515" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">GitHub</text>
<rect x="745" y="55" width="300" height="715" rx="12" fill="#f4f4f4" stroke="#aaa"/>
<text x="895" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">Home server (LAN only)</text>
<rect x="30" y="90" width="270" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="165.0" y="117.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">1. Edit in Claude Code</text>
<text x="165.0" y="135.0" text-anchor="middle" font-size="13" fill="#111">branch of homelab/</text>
<text x="165.0" y="153.0" text-anchor="middle" font-size="13" fill="#111">trmnl-calendar</text>
<rect x="30" y="220" width="270" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="165.0" y="256.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">2. git push + pull request</text>
<text x="165.0" y="274.0" text-anchor="middle" font-size="13" fill="#111">conventional commit messages</text>
<rect x="380" y="200" width="270" height="120" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="515.0" y="229.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">3. CI (GitHub Actions)</text>
<text x="515.0" y="247.0" text-anchor="middle" font-size="13" fill="#111">lint, unit + recurrence tests</text>
<text x="515.0" y="265.0" text-anchor="middle" font-size="13" fill="#111">image snapshot tests</text>
<text x="515.0" y="283.0" text-anchor="middle" font-size="13" fill="#111">fake-Terminus contract tests</text>
<text x="515.0" y="301.0" text-anchor="middle" font-size="13" fill="#111">docker build</text>
<rect x="380" y="360" width="270" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="515.0" y="391.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">4. Merge to main</text>
<text x="515.0" y="409.0" text-anchor="middle" font-size="13" fill="#111">(CI must be green)</text>
<rect x="380" y="470" width="270" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="515.0" y="502.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">5. Build multi-arch image</text>
<text x="515.0" y="520.0" text-anchor="middle" font-size="13" fill="#111">push to ghcr.io</text>
<text x="515.0" y="538.0" text-anchor="middle" font-size="13" fill="#111">tags: git sha + semver</text>
<rect x="760" y="470" width="270" height="90" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="895.0" y="502.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">6. Deploy timer (systemd)</text>
<text x="895.0" y="520.0" text-anchor="middle" font-size="13" fill="#111">docker compose pull</text>
<text x="895.0" y="538.0" text-anchor="middle" font-size="13" fill="#111">&amp;&amp; up -d (pinned tag)</text>
<path d="M895,585 L1010,625 L895,665 L780,625 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="895" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">7. Healthcheck</text>
<text x="895" y="640" text-anchor="middle" font-size="13" fill="#111">/healthz OK?</text>
<rect x="785" y="702" width="105" height="56" rx="8" fill="#e8f3e8" stroke="#222" stroke-width="1.5"/>
<text x="837.5" y="726.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">New version</text>
<text x="837.5" y="744.0" text-anchor="middle" font-size="13" fill="#111">live</text>
<rect x="900" y="702" width="105" height="56" rx="8" fill="#f7e9e9" stroke="#222" stroke-width="1.5"/>
<text x="952.5" y="726.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Roll back</text>
<text x="952.5" y="744.0" text-anchor="middle" font-size="13" fill="#111">+ notify</text>
<path d="M165,170 V220" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M300,260 H380" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M515,320 V360" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M515,430 V470" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M650,515 H760" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="705" y="503" text-anchor="middle" font-size="11" fill="#333">server pulls</text>
<text x="705" y="535" text-anchor="middle" font-size="11" fill="#333">(outbound)</text>
<path d="M895,560 V585" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M837,645 V702" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="845" y="683" text-anchor="start" font-size="11" fill="#333">yes</text>
<path d="M953,645 V702" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="961" y="683" text-anchor="start" font-size="11" fill="#333">no</text>
<text x="530" y="792" text-anchor="middle" font-size="12" fill="#333">No inbound ports: the server only makes outbound requests (to ghcr.io). Dashed arrow = pull, not push.</text>
</svg>